<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Vue Responsive – Aperçu du site</title>
  <style>
    body {
      background: #f4f6fb;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #232946;
    }
    h1 {
      text-align: center;
      margin: 32px 0 18px 0;
      font-size: 2.2em;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .views-block {
      margin: 0 auto 48px auto;
      max-width: 98vw;
      padding: 0 8px;
    }
    .views-block-title {
      font-size: 1.35em;
      font-weight: 800;
      color: #232946;
      margin: 36px 0 18px 0;
      letter-spacing: 0.03em;
      text-align: center;
      text-transform: uppercase;
      background: linear-gradient(90deg,#b8c1ec 0%,#ffe066 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .devices-row {
      display: flex;
      flex-direction: row;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .device-frame {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 32px #b8c1ec33, 0 0 4px #23294611;
      padding: 18px 8px 8px 8px;
      margin: 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 220px;
      position: relative;
      border: 2.5px solid #e0e7ff;
    }
    .device-label {
      text-align: center;
      font-size: 1.13em;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
      border-radius: 12px;
      padding: 4px 18px;
      margin-top: 0;
      margin-bottom: 12px;
      background: linear-gradient(90deg,#6ea8fe 0%,#ffe066 100%);
      color: #232946;
      box-shadow: 0 2px 8px #b8c1ec22;
      border: 1px solid #b8c1ec33;
      width: 90%;
      max-width: 220px;
    }
    .device-iframe {
      border: 1.5px solid #b8c1ec55;
      border-radius: 18px;
      box-shadow: 0 0 16px #b8c1ec22;
      background: #fff;
      transition: box-shadow 0.2s;
      width: 100%;
      min-width: 220px;
      max-width: 100%;
      min-height: 300px;
      display: block;
      overflow: hidden;
    }
    .device-frame.desktop .device-label::after { content: " (Ordinateur)"; font-size:0.95em; color:#6ea8fe; }
    .device-frame.tablet .device-label::after { content: " (Tablette)"; font-size:0.95em; color:#b8c1ec; }
    .device-frame.mobile .device-label::after { content: " (Mobile)"; font-size:0.95em; color:#ffe066; }
    .device-frame.desktop .device-iframe { width: 1200px; height: 800px; }
    .device-frame.tablet .device-iframe { width: 800px; height: 700px; }
    .device-frame.mobile .device-iframe { width: 375px; height: 700px; }
    @media (max-width: 1400px) {
      .device-frame.desktop .device-iframe { width: 900px; height: 600px; }
      .device-frame.tablet .device-iframe { width: 600px; height: 500px; }
    }
    @media (max-width: 900px) {
      .devices-row { flex-direction: column; gap: 24px; }
      .device-frame { margin-bottom: 32px; }
      .device-frame.desktop .device-iframe,
      .device-frame.tablet .device-iframe,
      .device-frame.mobile .device-iframe { width: 98vw; min-width: 0; max-width: 100vw; }
    }
    /* Scrollbar custom pour l’iframe */
    .device-iframe::-webkit-scrollbar { width: 8px; background: #e0e7ff; border-radius: 8px;}
    .device-iframe::-webkit-scrollbar-thumb { background: #b8c1ec; border-radius: 8px;}
  </style>
</head>
<body>
  <h1>Aperçu Responsive – Toutes les vues</h1>
  <div class="views-block">
    <div class="views-block-title">Accueil</div>
    <div class="devices-row">
      <div class="device-frame desktop">
        <div class="device-label">Vue Desktop</div>
        <iframe class="device-iframe" src="Page1.html"></iframe>
      </div>
      <div class="device-frame tablet">
        <div class="device-label">Vue Tablet</div>
        <iframe class="device-iframe" src="Page1.html"></iframe>
      </div>
      <div class="device-frame mobile">
        <div class="device-label">Vue Mobile</div>
        <iframe class="device-iframe" src="Page1.html"></iframe>
      </div>
    </div>
  </div>
  <div class="views-block">
    <div class="views-block-title">Frise</div>
    <div class="devices-row">
      <div class="device-frame desktop">
        <div class="device-label">Vue Desktop</div>
        <iframe class="device-iframe" src="Page2.html"></iframe>
      </div>
      <div class="device-frame tablet">
        <div class="device-label">Vue Tablet</div>
        <iframe class="device-iframe" src="Page2.html"></iframe>
      </div>
      <div class="device-frame mobile">
        <div class="device-label">Vue Mobile</div>
        <iframe class="device-iframe" src="Page2.html"></iframe>
      </div>
    </div>
  </div>
  <div class="views-block">
    <div class="views-block-title">Login</div>
    <div class="devices-row">
      <div class="device-frame desktop">
        <div class="device-label">Vue Desktop</div>
        <iframe class="device-iframe" src="Login.html"></iframe>
      </div>
      <div class="device-frame tablet">
        <div class="device-label">Vue Tablet</div>
        <iframe class="device-iframe" src="Login.html"></iframe>
      </div>
      <div class="device-frame mobile">
        <div class="device-label">Vue Mobile</div>
        <iframe class="device-iframe" src="Login.html"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
